<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101833">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Moon Doge">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Moon Doge</title>
<style>
:root{--safe-b:max(24px,env(safe-area-inset-bottom));--safe-t:max(14px,env(safe-area-inset-top))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8fd3ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none;overscroll-behavior:none}
body{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 6px #0009;font-weight:800;z-index:2}
#alt{position:absolute;top:var(--safe-t);left:16px;font-size:19px}
#target{position:absolute;top:var(--safe-t);right:16px;font-size:14px;text-align:right}
#combo{position:absolute;top:56px;left:50%;transform:translateX(-50%);font-size:18px;opacity:0}
#controls{position:fixed;inset:0;pointer-events:none;z-index:2}
#charge,#joybase{position:absolute;bottom:var(--safe-b);width:112px;height:112px;border-radius:50%;pointer-events:auto;user-select:none;-webkit-user-select:none}
#charge{left:22px;border:3px solid #fff9;background:#ffffff20;color:white;font-weight:900;display:grid;place-items:center}
#charge span{pointer-events:none;font-size:13px;letter-spacing:.4px}
#joybase{right:22px;border:3px solid #fff8;background:#ffffff16}
#knob{position:absolute;left:50%;top:50%;width:48px;height:48px;border-radius:50%;background:#fffc;transform:translate(-50%,-50%);pointer-events:none}
#overlay{position:fixed;inset:0;display:grid;place-items:center;background:#0005;color:white;text-align:center;z-index:5;padding:24px}
.card{padding:28px;border-radius:26px;background:#0b1630e8;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);max-width:340px;width:100%;box-shadow:0 16px 60px #0005}
h1{margin:0 0 8px;font-size:40px;letter-spacing:-1px}
p{opacity:.9;line-height:1.45}
button{font:inherit;font-weight:900;border:0;border-radius:999px;padding:15px 30px;background:white;color:#12213d;min-width:140px}
.small{font-size:12px;opacity:.7}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div id="alt">0 m</div>
  <div id="target">TARGET<br>SPACE 0%</div>
  <div id="combo"></div>
</div>
<div id="controls">
  <div id="charge"><span>CHARGE</span></div>
  <div id="joybase"><div id="knob"></div></div>
</div>
<div id="overlay">
  <div class="card">
    <h1>MOON DOGE</h1>
    <p>Charge. Jump. Keep going.</p>
    <p class="small">Bal: CHARGE · Jobb: joystick</p>
    <button id="play">PLAY</button>
  </div>
</div>
<script>
(()=> {
'use strict';
const $=id=>document.getElementById(id);
const canvas=$('game'),ctx=canvas.getContext('2d');
const altEl=$('alt'),targetEl=$('target'),comboEl=$('combo');
const overlay=$('overlay'),playBtn=$('play'),chargeBtn=$('charge'),joybase=$('joybase'),knob=$('knob');

let W=innerWidth,H=innerHeight,DPR=Math.min(devicePixelRatio||1,2);
function resize(){
  W=innerWidth; H=innerHeight; DPR=Math.min(devicePixelRatio||1,2);
  canvas.width=Math.floor(W*DPR); canvas.height=Math.floor(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize',resize,{passive:true});
addEventListener('orientationchange',()=>setTimeout(resize,150),{passive:true});
resize();

const CFG={gravity:1500,airAccel:980,maxX:330,damping:.90,minJump:610,maxJump:1040,chargeTime:.85,doubleMult:.72,platformH:16,deathPad:170,camSmooth:.11};
let state='menu',last=performance.now(),platforms=[],particles=[],stars=[];
let cameraY=0,combo=0,highest=0,nextSpawnY=0,joyX=0,charging=false,charge=0;
let activeChargeId=null,activeJoyId=null;

function safeLoadBest(){try{return +(localStorage.getItem('moonDogeBest')||0)}catch(e){return 0}}
function safeSaveBest(v){try{localStorage.setItem('moonDogeBest',String(v))}catch(e){}}
let best=safeLoadBest();

const doge={x:W/2,y:H-190,w:46,h:42,vx:0,vy:0,onGround:false,doubleReady:true};
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const sy=y=>y-cameraY;

function zone(a){if(a<2500)return'GROUND';if(a<9000)return'CLOUDS';if(a<18000)return'ATMOSPHERE';if(a<32000)return'SPACE';return'MOON'}
function grav(a){if(a<18000)return 1;if(a<32000)return .78;return .55}
function bg(a){
  const t=clamp(a/32000,0,1);
  if(t<.28)return['#8fd3ff','#dff4ff'];
  if(t<.58)return['#4e7fd1','#b8d8ff'];
  if(t<.8)return['#172c59','#6c78aa'];
  return['#050913','#111a38']
}
function rr(x,y,w,h,r,fill=true){
  r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();if(fill)ctx.fill()
}
function reset(){
  platforms=[];particles=[];stars=[];combo=0;highest=0;cameraY=0;charging=false;charge=0;
  doge.x=W/2;doge.y=H-190;doge.vx=0;doge.vy=0;doge.onGround=false;doge.doubleReady=true;
  platforms.push({x:W/2-90,y:H-100,w:180,h:CFG.platformH,type:'normal',baseX:W/2-90,t:0,dead:false,crumble:0});
  nextSpawnY=H-180;
  for(let i=0;i<38;i++)spawnPlatform();
  for(let i=0;i<90;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5+.25});
}
function spawnPlatform(){
  const a=Math.max(0,(H-nextSpawnY)*18),z=zone(a);
  let gap=z==='GROUND'?rand(72,108):z==='CLOUDS'?rand(82,124):rand(90,138);
  nextSpawnY-=gap;
  let w=z==='GROUND'?rand(100,158):z==='CLOUDS'?rand(92,150):rand(80,140);
  let x=rand(14,Math.max(15,W-w-14)),r=Math.random(),type='normal';
  if(z!=='GROUND'&&r<.18)type='moving';
  if((z==='ATMOSPHERE'||z==='SPACE'||z==='MOON')&&r>.82)type='crumble';
  if((z==='SPACE'||z==='MOON')&&r>.92)type='bounce';
  platforms.push({x,y:nextSpawnY,w,h:CFG.platformH,type,baseX:x,t:rand(0,10),dead:false,crumble:0});
}
function puff(x,y,n=8){for(let i=0;i<n;i++)particles.push({x,y,vx:rand(-80,80),vy:rand(-130,-25),life:rand(.25,.55),r:rand(2,5)})}
function jump(power,isDouble){
  const gm=grav(highest);
  doge.vy=-(CFG.minJump+(CFG.maxJump-CFG.minJump)*power)*(isDouble?CFG.doubleMult:1)*Math.sqrt(gm);
  doge.onGround=false;if(isDouble)doge.doubleReady=false;
  puff(doge.x+doge.w/2,doge.y+doge.h,isDouble?12:7);
  if(navigator.vibrate && power>.9) navigator.vibrate(12);
}
function startCharge(id){
  if(state!=='playing'||activeChargeId!==null)return;
  activeChargeId=id;charging=true;charge=0;
}
function endCharge(id){
  if(id!==activeChargeId)return;
  if(charging){if(doge.onGround)jump(charge,false);else if(doge.doubleReady)jump(charge,true)}
  charging=false;charge=0;activeChargeId=null;
}

function pointerSupported(){return 'PointerEvent' in window}
if(pointerSupported()){
  chargeBtn.addEventListener('pointerdown',e=>{e.preventDefault();chargeBtn.setPointerCapture?.(e.pointerId);startCharge(e.pointerId)});
  chargeBtn.addEventListener('pointerup',e=>{e.preventDefault();endCharge(e.pointerId)});
  chargeBtn.addEventListener('pointercancel',e=>endCharge(e.pointerId));
  joybase.addEventListener('pointerdown',e=>{e.preventDefault();activeJoyId=e.pointerId;joybase.setPointerCapture?.(e.pointerId);joyMove(e.clientX,e.clientY)});
  joybase.addEventListener('pointermove',e=>{if(e.pointerId===activeJoyId)joyMove(e.clientX,e.clientY)});
  joybase.addEventListener('pointerup',e=>joyEnd(e.pointerId));
  joybase.addEventListener('pointercancel',e=>joyEnd(e.pointerId));
}else{
  chargeBtn.addEventListener('touchstart',e=>{e.preventDefault();startCharge('touch')},{passive:false});
  chargeBtn.addEventListener('touchend',e=>{e.preventDefault();endCharge('touch')},{passive:false});
  joybase.addEventListener('touchstart',e=>{e.preventDefault();activeJoyId='touch';let t=e.touches[0];joyMove(t.clientX,t.clientY)},{passive:false});
  joybase.addEventListener('touchmove',e=>{e.preventDefault();let t=e.touches[0];joyMove(t.clientX,t.clientY)},{passive:false});
  joybase.addEventListener('touchend',e=>{e.preventDefault();joyEnd('touch')},{passive:false});
}
function joyMove(cx0,cy0){
  const r=joybase.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,max=r.width*.32;
  let dx=cx0-cx,dy=cy0-cy,d=Math.hypot(dx,dy)||1;if(d>max){dx*=max/d;dy*=max/d}
  joyX=clamp(dx/max,-1,1);knob.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy*.2}px))`
}
function joyEnd(id){if(id===activeJoyId){activeJoyId=null;joyX=0;knob.style.transform='translate(-50%,-50%)'}}

addEventListener('keydown',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA')joyX=-1;
  if(e.code==='ArrowRight'||e.code==='KeyD')joyX=1;
  if(e.code==='Space'&&!charging)startCharge('kbd')
});
addEventListener('keyup',e=>{
  if(['ArrowLeft','KeyA','ArrowRight','KeyD'].includes(e.code))joyX=0;
  if(e.code==='Space')endCharge('kbd')
});

function begin(){overlay.style.display='none';state='playing';reset()}
playBtn.addEventListener('click',begin);
playBtn.addEventListener('touchend',e=>{e.preventDefault();begin()},{passive:false});

function gameOver(){
  state='gameover';best=Math.max(best,highest);safeSaveBest(best);
  overlay.innerHTML=`<div class="card"><h1>YOU FELL</h1><p>Altitude: <b>${Math.floor(highest)} m</b><br>Best: <b>${Math.floor(best)} m</b></p><button id="retry">RETRY</button></div>`;
  overlay.style.display='grid';
  $('retry').onclick=begin;
}
function update(dt){
  if(state!=='playing')return;
  if(charging)charge=clamp(charge+dt/CFG.chargeTime,0,1);
  chargeBtn.style.background=`rgba(255,255,255,${.12+charge*.20})`;

  doge.vx+=joyX*CFG.airAccel*dt;doge.vx=clamp(doge.vx,-CFG.maxX,CFG.maxX);doge.vx*=Math.pow(CFG.damping,dt*60);
  doge.vy+=CFG.gravity*grav(highest)*dt;doge.x+=doge.vx*dt;doge.y+=doge.vy*dt;doge.x=clamp(doge.x,0,W-doge.w);
  doge.onGround=false;

  for(const p of platforms){
    p.t+=dt;if(p.type==='moving')p.x=p.baseX+Math.sin(p.t*1.35)*Math.min(55,W*.12);
    if(p.type==='crumble'&&p.crumble>0){p.crumble+=dt;if(p.crumble>1)p.dead=true}
  }

  if(doge.vy>=0){
    const prevBottom=doge.y+doge.h-doge.vy*dt,nowBottom=doge.y+doge.h;
    for(const p of platforms){
      if(p.dead)continue;
      if(doge.x+doge.w>p.x&&doge.x<p.x+p.w&&prevBottom<=p.y&&nowBottom>=p.y&&nowBottom<=p.y+30){
        doge.y=p.y-doge.h;
        if(p.type==='bounce'){doge.vy=-CFG.maxJump*.92;doge.doubleReady=true;puff(doge.x+doge.w/2,p.y,12)}
        else{
          doge.vy=0;doge.onGround=true;doge.doubleReady=true;
          if(p.type==='crumble'&&p.crumble===0)p.crumble=.001;
          const perfect=Math.abs((doge.x+doge.w/2)-(p.x+p.w/2))<p.w*.18;
          if(perfect){combo++;comboEl.textContent=`PERFECT x${combo}`;comboEl.style.opacity=1;puff(doge.x+doge.w/2,p.y,10)}
          else{combo=0;comboEl.style.opacity=0}
        }
        break;
      }
    }
  }

  cameraY=lerp(cameraY,Math.min(cameraY,doge.y-H*.42),1-Math.pow(1-CFG.camSmooth,dt*60));
  highest=Math.max(highest,Math.max(0,(H-100-doge.y)*18));
  altEl.textContent=`${Math.floor(highest).toLocaleString()} m`;
  let targ='SPACE',pct=clamp(highest/18000*100,0,100);
  if(highest>=18000){targ='MOON';pct=clamp((highest-18000)/14000*100,0,100)}
  targetEl.innerHTML=`TARGET<br>${targ} ${Math.floor(pct)}%`;

  while(nextSpawnY>cameraY-1500)spawnPlatform();
  platforms=platforms.filter(p=>!p.dead&&p.y<cameraY+H+500);
  for(const q of particles){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=300*dt;q.life-=dt}
  particles=particles.filter(q=>q.life>0);
  if(doge.y-cameraY>H+CFG.deathPad)gameOver();
}
function drawDoge(){
  const x=doge.x,y=sy(doge.y);ctx.save();ctx.translate(x+doge.w/2,y+doge.h/2);
  const sq=charging?1-charge*.14:1;ctx.scale(1+(1-sq)*.55,sq);
  ctx.fillStyle='#d98a45';rr(-19,-12,38,28,12);
  ctx.beginPath();ctx.arc(0,-15,16,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.moveTo(-13,-24);ctx.lineTo(-8,-38);ctx.lineTo(-2,-25);ctx.fill();
  ctx.beginPath();ctx.moveTo(13,-24);ctx.lineTo(8,-38);ctx.lineTo(2,-25);ctx.fill();
  ctx.fillStyle='#f5e7d3';ctx.beginPath();ctx.ellipse(0,-10,9,6,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#202020';ctx.beginPath();ctx.arc(-5,-17,1.8,0,7);ctx.arc(5,-17,1.8,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(0,-10,2,0,7);ctx.fill();
  ctx.strokeStyle='#d98a45';ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();ctx.arc(19,2,10,-1.8,1.2);ctx.stroke();
  ctx.restore();
}
function draw(){
  const [a,b]=bg(highest),g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,a);g.addColorStop(1,b);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  if(highest>11000){ctx.fillStyle='#fff';ctx.globalAlpha=clamp((highest-11000)/9000,0,1)*.9;for(const s of stars)ctx.fillRect(s.x,s.y,s.r,s.r);ctx.globalAlpha=1}
  if(highest>17000){const ey=H+180-clamp((highest-17000)/9000,0,1)*80;ctx.fillStyle='#2f74c8';ctx.beginPath();ctx.arc(W/2,ey,W*.72,Math.PI,Math.PI*2);ctx.fill()}
  for(const p of platforms){
    const y=sy(p.y);if(y<-80||y>H+80)continue;
    ctx.globalAlpha=p.type==='crumble'&&p.crumble>0?clamp(1-p.crumble*.6,.35,1):1;
    ctx.fillStyle=p.type==='moving'?'#d6f3ff':p.type==='crumble'?'#f0d7b0':p.type==='bounce'?'#c8ffd3':'#ffffffdd';rr(p.x,y,p.w,p.h,8);
    if(p.type==='crumble'&&p.crumble>0){ctx.strokeStyle='#8b6a49';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(p.x+p.w*.45,y);ctx.lineTo(p.x+p.w*.55,y+8);ctx.lineTo(p.x+p.w*.48,y+16);ctx.stroke()}
    ctx.globalAlpha=1;
  }
  for(const q of particles){ctx.globalAlpha=clamp(q.life*2,0,1);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(q.x,sy(q.y),q.r,0,7);ctx.fill()}ctx.globalAlpha=1;
  drawDoge();
  if(highest>=32000){ctx.fillStyle='#fff';ctx.font='900 28px -apple-system,sans-serif';ctx.textAlign='center';ctx.fillText('MOON REACHED!',W/2,120)}
}
function loop(now){
  const dt=Math.min((now-last)/1000,.033);last=now;update(dt);draw();requestAnimationFrame(loop)
}
requestAnimationFrame(loop);

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
})();
</script>
</body>
</html>
