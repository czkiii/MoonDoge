<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1022">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Moon Doge">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Moon Doge</title>
<style>
:root{
  --safe-b:max(18px,env(safe-area-inset-bottom));
  --safe-t:max(14px,env(safe-area-inset-top));
  --control-h:22vh;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;background:#0b1022;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  touch-action:none;overscroll-behavior:none
}
body{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 8px #000b;font-weight:800;z-index:2}
#alt{position:absolute;top:var(--safe-t);left:18px;font-size:20px}
#target{position:absolute;top:var(--safe-t);right:18px;font-size:14px;text-align:right}
#combo{position:absolute;top:58px;left:50%;transform:translateX(-50%);font-size:18px;opacity:0;transition:opacity .18s ease}
#zoneName{position:absolute;top:90px;left:50%;transform:translateX(-50%);font-size:12px;letter-spacing:1.5px;opacity:.72}
#controlZone{
  position:fixed;left:0;right:0;bottom:0;height:var(--control-h);z-index:3;pointer-events:auto;
  background:linear-gradient(to bottom,rgba(6,10,24,0),rgba(6,10,24,.68) 40%,rgba(6,10,24,.88));
  border-top:1px solid rgba(255,255,255,.06);
  backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)
}
#boostWrap{position:absolute;left:24px;bottom:var(--safe-b);width:148px;height:148px;display:grid;place-items:center;pointer-events:auto}
#boost{position:absolute;inset:8px;border-radius:50%;background:rgba(255,255,255,.09);border:2px solid rgba(255,255,255,.42);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),0 8px 28px rgba(0,0,0,.2);display:grid;place-items:center;transform:scale(1);transition:transform .06s linear, background .06s linear}
#boostCore{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.10);color:#fff;font-weight:900;font-size:15px;letter-spacing:.6px;text-align:center}
#boostMeter{position:absolute;inset:0;width:148px;height:148px;transform:rotate(-90deg);pointer-events:none}
#boostTrack,#boostProgress{fill:none;stroke-width:8}
#boostTrack{stroke:rgba(255,255,255,.12)}
#boostProgress{stroke:#fff;stroke-linecap:round;stroke-dasharray:389;stroke-dashoffset:389;filter:drop-shadow(0 0 7px rgba(255,255,255,.5))}
#boostWrap.disabled{opacity:.4}
#tiltVisual{position:absolute;right:24px;bottom:calc(var(--safe-b) + 22px);width:164px;height:94px;pointer-events:none;opacity:.78}
#phoneIcon{position:absolute;left:50%;top:50%;width:54px;height:86px;border:3px solid rgba(255,255,255,.72);border-radius:13px;transform:translate(-50%,-50%) rotate(0deg);transition:transform .05s linear}
#tiltLabel{position:absolute;bottom:-4px;left:0;right:0;text-align:center;color:#fff;font-size:11px;font-weight:800;letter-spacing:.6px}
#overlay{position:fixed;inset:0;display:grid;place-items:center;background:#0007;color:#fff;text-align:center;z-index:8;padding:24px}
.card{padding:30px;border-radius:28px;background:#0b1630ee;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);max-width:360px;width:100%;box-shadow:0 20px 70px #0007}
h1{margin:0 0 8px;font-size:42px;letter-spacing:-1.5px}
p{opacity:.9;line-height:1.45}
button{font:inherit;font-weight:900;border:0;border-radius:999px;padding:15px 31px;background:#fff;color:#12213d;min-width:165px;margin-top:8px}
.small{font-size:12px;opacity:.72}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div id="alt">0 m</div>
  <div id="target">TARGET<br>SPACE 0%</div>
  <div id="combo"></div>
  <div id="zoneName">GROUND</div>
</div>

<div id="controlZone">
  <div id="boostWrap" class="disabled">
    <svg id="boostMeter" viewBox="0 0 148 148">
      <circle id="boostTrack" cx="74" cy="74" r="62"></circle>
      <circle id="boostProgress" cx="74" cy="74" r="62"></circle>
    </svg>
    <div id="boost"><div id="boostCore">BOOST</div></div>
  </div>
  <div id="tiltVisual">
    <div id="phoneIcon"></div>
    <div id="tiltLabel">TILT TO STEER</div>
  </div>
</div>

<div id="overlay">
  <div class="card">
    <h1>MOON DOGE</h1>
    <p>Jump from Earth to the Moon.</p>
    <p class="small">A Shiba auto-jumps. Tilt to steer. Hold BOOST in the air, then release.</p>
    <button id="play">PLAY</button>
  </div>
</div>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const canvas=$('game'),ctx=canvas.getContext('2d');
const altEl=$('alt'),targetEl=$('target'),comboEl=$('combo'),zoneName=$('zoneName');
const overlay=$('overlay'),playBtn=$('play');
const boostWrap=$('boostWrap'),boostBtn=$('boost'),boostCore=$('boostCore'),boostProgress=$('boostProgress');
const phoneIcon=$('phoneIcon');

let W=innerWidth,H=innerHeight,DPR=Math.min(devicePixelRatio||1,2);
let CONTROL_H=Math.max(200,H*.22),PLAY_H=H-CONTROL_H;
function resize(){
  W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);
  CONTROL_H=Math.max(200,H*.22);PLAY_H=H-CONTROL_H;
  document.documentElement.style.setProperty('--control-h',CONTROL_H+'px');
  canvas.width=Math.floor(W*DPR);canvas.height=Math.floor(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize',resize,{passive:true});
addEventListener('orientationchange',()=>setTimeout(resize,150),{passive:true});
resize();

const CFG={
  gravity:1480,
  baseAutoJump:820,
  airAccel:1180,
  maxX:360,
  damping:.915,
  boostMin:330,
  boostMax:700,
  boostTime:.72,
  platformH:18,
  deathPad:85,
  camSmooth:.09,
  tiltDeadzone:3,
  tiltMax:20,
  moonAltitude:120000,
  spaceAltitude:45000
};

let state='menu',last=performance.now(),platforms=[],particles=[],stars=[],decor=[];
let cameraY=0,combo=0,highest=0,nextSpawnY=0;
let steer=0,keyboardSteer=0,motionEnabled=false;
let charging=false,boostCharge=0,activeBoostId=null,boostReady=true;
let currentZone='GROUND',zoneToast=0,moonReached=false;

function safeLoadBest(){try{return +(localStorage.getItem('moonDogeBest')||0)}catch(e){return 0}}
function safeSaveBest(v){try{localStorage.setItem('moonDogeBest',String(v))}catch(e){}}
let best=safeLoadBest();

const doge={x:W/2-27,y:PLAY_H-150,w:54,h:52,vx:0,vy:0};

const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const sy=y=>y-cameraY;

function zoneFor(a){
  if(a<8000)return'GROUND';
  if(a<24000)return'CLOUDS';
  if(a<45000)return'ATMOSPHERE';
  if(a<100000)return'SPACE';
  return'MOON';
}
function gravityMult(a){
  if(a<45000)return 1;
  if(a<100000)return .84;
  return .68;
}
function bg(a){
  if(a<8000)return['#8fd7ff','#e9f8ff'];
  if(a<24000)return['#69a9ef','#d6ebff'];
  if(a<45000)return['#314b78','#8ca8d3'];
  if(a<100000)return['#0b1430','#18244a'];
  return['#060813','#11172c'];
}
function rr(x,y,w,h,r,fill=true,stroke=false){
  r=Math.min(r,w/2,h/2);ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
  if(fill)ctx.fill();if(stroke)ctx.stroke();
}

function reset(){
  platforms=[];particles=[];stars=[];decor=[];
  cameraY=0;combo=0;highest=0;nextSpawnY=0;
  steer=0;keyboardSteer=0;charging=false;boostCharge=0;boostReady=true;
  currentZone='GROUND';zoneToast=0;moonReached=false;
  doge.x=W/2-27;doge.y=PLAY_H-154;doge.vx=0;doge.vy=0;

  platforms.push({x:W/2-112,y:PLAY_H-72,w:224,h:22,type:'ground',baseX:W/2-112,t:0,dead:false,crumble:0,zone:'GROUND',style:0});
  nextSpawnY=PLAY_H-150;
  for(let i=0;i<38;i++)spawnPlatform();
  for(let i=0;i<120;i++)stars.push({x:Math.random()*W,y:Math.random()*PLAY_H,r:Math.random()*1.6+.25});
  updateBoostUI();
}

function platformTypeFor(z,r){
  if(z==='GROUND'){
    if(r<.16)return'roof';
    if(r<.26)return'branch';
    return'rock';
  }
  if(z==='CLOUDS'){
    if(r<.20)return'balloon';
    if(r<.34)return'movingCloud';
    return'cloud';
  }
  if(z==='ATMOSPHERE'){
    if(r<.18)return'plane';
    if(r<.34)return'movingCloud';
    if(r>.84)return'crumbleCloud';
    return'cloud';
  }
  if(z==='SPACE'){
    if(r<.22)return'satellite';
    if(r<.40)return'asteroid';
    if(r>.88)return'boostRock';
    return'asteroid';
  }
  if(r<.24)return'moonRock';
  if(r<.42)return'asteroid';
  return'moonRock';
}

function spawnPlatform(){
  const altitude=Math.max(0,(PLAY_H-nextSpawnY)*42);
  const z=zoneFor(altitude);

  // Fewer, more meaningful targets: generally 2–4 visible at once.
  let gap;
  if(z==='GROUND') gap=rand(118,152);
  else if(z==='CLOUDS') gap=rand(126,166);
  else if(z==='ATMOSPHERE') gap=rand(136,176);
  else if(z==='SPACE') gap=rand(142,184);
  else gap=rand(138,174);

  nextSpawnY-=gap;

  let w;
  if(z==='GROUND')w=rand(110,178);
  else if(z==='CLOUDS')w=rand(106,170);
  else if(z==='ATMOSPHERE')w=rand(96,156);
  else if(z==='SPACE')w=rand(90,148);
  else w=rand(102,160);

  const x=rand(18,Math.max(19,W-w-18));
  const r=Math.random();
  const type=platformTypeFor(z,r);

  platforms.push({
    x,y:nextSpawnY,w,h:CFG.platformH,type,baseX:x,t:rand(0,10),
    dead:false,crumble:0,zone:z,style:Math.floor(rand(0,3))
  });
}

function puff(x,y,n=8,kind='soft'){
  for(let i=0;i<n;i++){
    particles.push({x,y,vx:rand(-100,100),vy:rand(-160,-20),life:rand(.28,.6),r:rand(2,5.5),kind});
  }
}

function autoBounce(mult=1){
  const z=zoneFor(highest);
  const zoneFactor=z==='SPACE'?1.04:z==='MOON'?1.08:1;
  doge.vy=-CFG.baseAutoJump*mult*zoneFactor*Math.sqrt(gravityMult(highest));
  boostReady=true;
  puff(doge.x+doge.w/2,doge.y+doge.h,10,'soft');
}

function doBoost(power){
  if(!boostReady)return;
  const force=CFG.boostMin+(CFG.boostMax-CFG.boostMin)*power;
  doge.vy-=force*Math.sqrt(gravityMult(highest));
  doge.vy=Math.max(doge.vy,-1160);
  boostReady=false;
  puff(doge.x+doge.w/2,doge.y+doge.h,16,'burst');
  if(navigator.vibrate)navigator.vibrate(power>.8?13:7);
}

function updateBoostUI(){
  const c=389;
  boostProgress.style.strokeDashoffset=String(c*(1-boostCharge));
  boostBtn.style.transform=`scale(${1-boostCharge*.07})`;
  boostBtn.style.background=`rgba(255,255,255,${.09+boostCharge*.21})`;
  boostCore.textContent=charging?`${Math.round(boostCharge*100)}%`:(boostReady?'BOOST':'USED');
  boostWrap.classList.toggle('disabled',!boostReady&&!charging);
}
function startBoost(id){
  if(state!=='playing'||activeBoostId!==null||!boostReady)return;
  activeBoostId=id;charging=true;boostCharge=0;updateBoostUI();
}
function endBoost(id){
  if(id!==activeBoostId)return;
  if(charging&&boostReady)doBoost(boostCharge);
  charging=false;boostCharge=0;activeBoostId=null;updateBoostUI();
}

if('PointerEvent'in window){
  boostWrap.addEventListener('pointerdown',e=>{e.preventDefault();boostWrap.setPointerCapture?.(e.pointerId);startBoost(e.pointerId)});
  boostWrap.addEventListener('pointerup',e=>{e.preventDefault();endBoost(e.pointerId)});
  boostWrap.addEventListener('pointercancel',e=>endBoost(e.pointerId));
}else{
  boostWrap.addEventListener('touchstart',e=>{e.preventDefault();startBoost('touch')},{passive:false});
  boostWrap.addEventListener('touchend',e=>{e.preventDefault();endBoost('touch')},{passive:false});
}

function handleOrientation(e){
  if(!motionEnabled)return;
  const g=typeof e.gamma==='number'?e.gamma:0;
  const a=Math.abs(g);
  steer=a<CFG.tiltDeadzone?0:Math.sign(g)*clamp((a-CFG.tiltDeadzone)/(CFG.tiltMax-CFG.tiltDeadzone),0,1);
  phoneIcon.style.transform=`translate(-50%,-50%) rotate(${clamp(g,-18,18)*.95}deg)`;
}
async function requestMotionPermission(){
  try{
    if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
      const res=await DeviceOrientationEvent.requestPermission();
      if(res!=='granted')return false;
    }
    motionEnabled=true;
    addEventListener('deviceorientation',handleOrientation,true);
    return true;
  }catch(e){return false}
}

addEventListener('keydown',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA')keyboardSteer=-1;
  if(e.code==='ArrowRight'||e.code==='KeyD')keyboardSteer=1;
  if(e.code==='Space'&&!charging)startBoost('kbd');
});
addEventListener('keyup',e=>{
  if(['ArrowLeft','KeyA','ArrowRight','KeyD'].includes(e.code))keyboardSteer=0;
  if(e.code==='Space')endBoost('kbd');
});

async function begin(){
  await requestMotionPermission();
  overlay.style.display='none';state='playing';reset();
  setTimeout(()=>{if(state==='playing'&&doge.vy===0)autoBounce(1)},180);
}
playBtn.addEventListener('click',begin);
playBtn.addEventListener('touchend',e=>{e.preventDefault();begin()},{passive:false});

function gameOver(){
  state='gameover';
  best=Math.max(best,highest);safeSaveBest(best);
  const z=zoneFor(highest);
  overlay.innerHTML=`<div class="card"><h1>YOU FELL</h1>
  <p>Altitude: <b>${Math.floor(highest).toLocaleString()} m</b><br>
  Best: <b>${Math.floor(best).toLocaleString()} m</b><br>
  Zone: <b>${z}</b></p>
  <button id="retry">RETRY</button></div>`;
  overlay.style.display='grid';
  $('retry').onclick=()=>{overlay.style.display='none';state='playing';reset();setTimeout(()=>autoBounce(1),160)};
}

function moonWin(){
  moonReached=true;state='won';
  best=Math.max(best,highest);safeSaveBest(best);
  setTimeout(()=>{
    overlay.innerHTML=`<div class="card"><h1>MOON REACHED</h1>
    <p>The Shiba made it.<br><br>Altitude: <b>${Math.floor(highest).toLocaleString()} m</b></p>
    <button id="retry">AGAIN</button></div>`;
    overlay.style.display='grid';
    $('retry').onclick=()=>{overlay.style.display='none';state='playing';reset();setTimeout(()=>autoBounce(1),160)};
  },500);
}

function update(dt){
  if(state!=='playing')return;

  if(charging){
    boostCharge=clamp(boostCharge+dt/CFG.boostTime,0,1);
    updateBoostUI();
  }

  const input=keyboardSteer!==0?keyboardSteer:steer;

  // Softer, more readable air steering.
  doge.vx+=input*CFG.airAccel*dt;
  doge.vx=clamp(doge.vx,-CFG.maxX,CFG.maxX);
  doge.vx*=Math.pow(CFG.damping,dt*60);
  doge.vy+=CFG.gravity*gravityMult(highest)*dt;
  doge.x+=doge.vx*dt;doge.y+=doge.vy*dt;
  doge.x=clamp(doge.x,-6,W-doge.w+6);

  for(const p of platforms){
    p.t+=dt;
    if(p.type==='movingCloud'||p.type==='plane')p.x=p.baseX+Math.sin(p.t*1.15)*Math.min(64,W*.14);
    if(p.type==='crumbleCloud'&&p.crumble>0){
      p.crumble+=dt;if(p.crumble>1.05)p.dead=true;
    }
  }

  if(doge.vy>=0){
    const prevBottom=doge.y+doge.h-doge.vy*dt;
    const nowBottom=doge.y+doge.h;
    for(const p of platforms){
      if(p.dead)continue;
      if(doge.x+doge.w>p.x&&doge.x<p.x+p.w&&prevBottom<=p.y&&nowBottom>=p.y&&nowBottom<=p.y+34){
        doge.y=p.y-doge.h;
        if(p.type==='crumbleCloud'&&p.crumble===0)p.crumble=.001;

        const center=doge.x+doge.w/2,pc=p.x+p.w/2;
        const perfect=Math.abs(center-pc)<p.w*.15;
        if(perfect){
          combo=Math.min(combo+1,8);
          comboEl.textContent=`PERFECT x${combo}`;comboEl.style.opacity=1;
          puff(center,p.y,12,'spark');
          if(navigator.vibrate)navigator.vibrate(7);
        }else{
          combo=0;comboEl.style.opacity=0;
        }

        const special=(p.type==='boostRock'?1.20:p.type==='balloon'?1.12:1);
        autoBounce(special);
        break;
      }
    }
  }

  // Camera follows the apex more gently, not constant aggressive scrolling.
  const desired=doge.y-PLAY_H*.38;
  if(desired<cameraY){
    cameraY=lerp(cameraY,desired,1-Math.pow(1-CFG.camSmooth,dt*60));
  }

  highest=Math.max(highest,Math.max(0,(PLAY_H-72-doge.y)*42));
  altEl.textContent=`${Math.floor(highest).toLocaleString()} m`;

  const z=zoneFor(highest);
  if(z!==currentZone){
    currentZone=z;zoneToast=1.7;
    zoneName.style.opacity=1;
  }
  if(zoneToast>0){
    zoneToast-=dt;zoneName.textContent=currentZone;
    zoneName.style.opacity=clamp(zoneToast,0,1);
  }else{
    zoneName.textContent=currentZone;zoneName.style.opacity=.72;
  }

  let targ='SPACE',pct=clamp(highest/CFG.spaceAltitude*100,0,100);
  if(highest>=CFG.spaceAltitude){
    targ='MOON';pct=clamp((highest-CFG.spaceAltitude)/(CFG.moonAltitude-CFG.spaceAltitude)*100,0,100);
  }
  targetEl.innerHTML=`TARGET<br>${targ} ${Math.floor(pct)}%`;

  while(nextSpawnY>cameraY-1700)spawnPlatform();
  platforms=platforms.filter(p=>!p.dead&&p.y<cameraY+PLAY_H+520);

  for(const q of particles){
    q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=300*dt;q.life-=dt;
  }
  particles=particles.filter(q=>q.life>0);

  if(highest>=CFG.moonAltitude&&!moonReached){moonWin();return}
  if(doge.y-cameraY>PLAY_H+CFG.deathPad)gameOver();
}

function drawPlatform(p,y){
  const t=p.type;
  if(t==='ground'){
    ctx.fillStyle='#6f9459';rr(p.x,y,p.w,22,9);
    ctx.fillStyle='#91b86f';rr(p.x,y,p.w,7,5);
    return;
  }
  if(t==='rock'||t==='moonRock'||t==='asteroid'||t==='boostRock'){
    ctx.fillStyle=t==='moonRock'?'#bfc2cb':t==='asteroid'?'#8f8178':t==='boostRock'?'#7fa8a8':'#8b8070';
    ctx.beginPath();
    ctx.moveTo(p.x+8,y+4);ctx.lineTo(p.x+p.w*.22,y-6);ctx.lineTo(p.x+p.w*.62,y-3);ctx.lineTo(p.x+p.w-5,y+5);
    ctx.lineTo(p.x+p.w-12,y+p.h);ctx.lineTo(p.x+10,y+p.h);ctx.closePath();ctx.fill();
    if(t==='boostRock'){ctx.strokeStyle='#a9fff0';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x+p.w/2,y+7,9,0,Math.PI*2);ctx.stroke()}
    return;
  }
  if(t==='roof'){
    ctx.fillStyle='#be6e54';
    ctx.beginPath();ctx.moveTo(p.x,y+p.h);ctx.lineTo(p.x+p.w*.5,y-10);ctx.lineTo(p.x+p.w,y+p.h);ctx.closePath();ctx.fill();
    ctx.fillStyle='#e3a17e';rr(p.x+15,y+p.h-5,p.w-30,8,3);return;
  }
  if(t==='branch'){
    ctx.strokeStyle='#6b4b35';ctx.lineWidth=12;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(p.x+8,y+8);ctx.lineTo(p.x+p.w-8,y+8);ctx.stroke();
    ctx.strokeStyle='#7faa62';ctx.lineWidth=5;
    ctx.beginPath();ctx.moveTo(p.x+p.w*.28,y+7);ctx.lineTo(p.x+p.w*.22,y-5);ctx.moveTo(p.x+p.w*.68,y+7);ctx.lineTo(p.x+p.w*.75,y-5);ctx.stroke();return;
  }
  if(t==='cloud'||t==='movingCloud'||t==='crumbleCloud'){
    ctx.fillStyle=t==='crumbleCloud'?'#e3d6c7':'#effaff';
    rr(p.x,y,p.w,p.h,10);
    ctx.beginPath();ctx.arc(p.x+p.w*.22,y+1,13,0,Math.PI*2);ctx.arc(p.x+p.w*.46,y-5,18,0,Math.PI*2);ctx.arc(p.x+p.w*.70,y+1,14,0,Math.PI*2);ctx.fill();
    if(t==='movingCloud'){
      ctx.strokeStyle='rgba(71,112,157,.7)';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(p.x+p.w*.27,y+p.h/2);ctx.lineTo(p.x+p.w*.16,y+p.h/2);ctx.moveTo(p.x+p.w*.73,y+p.h/2);ctx.lineTo(p.x+p.w*.84,y+p.h/2);ctx.stroke();
    }
    if(t==='crumbleCloud'&&p.crumble>0){
      ctx.strokeStyle='#9b7f61';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(p.x+p.w*.44,y);ctx.lineTo(p.x+p.w*.50,y+8);ctx.lineTo(p.x+p.w*.46,y+p.h);ctx.stroke();
    }
    return;
  }
  if(t==='balloon'){
    ctx.fillStyle='#f1b457';ctx.beginPath();ctx.ellipse(p.x+p.w/2,y-18,p.w*.28,24,0,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#6f5d4c';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(p.x+p.w*.42,y+4);ctx.lineTo(p.x+p.w*.48,y-2);ctx.moveTo(p.x+p.w*.58,y+4);ctx.lineTo(p.x+p.w*.52,y-2);ctx.stroke();
    ctx.fillStyle='#8d6b4c';rr(p.x+p.w*.40,y,p.w*.20,12,3);return;
  }
  if(t==='plane'){
    ctx.fillStyle='#dce5ef';rr(p.x,y,p.w,p.h,7);
    ctx.beginPath();ctx.moveTo(p.x+p.w*.44,y+8);ctx.lineTo(p.x+p.w*.60,y-12);ctx.lineTo(p.x+p.w*.66,y+8);ctx.closePath();ctx.fill();
    ctx.fillStyle='#7fa1c5';rr(p.x+p.w*.12,y+5,p.w*.22,5,2);return;
  }
  if(t==='satellite'){
    ctx.fillStyle='#c9d1db';rr(p.x+p.w*.39,y-2,p.w*.22,p.h+6,5);
    ctx.fillStyle='#587aa8';rr(p.x,y+1,p.w*.34,p.h-2,2);rr(p.x+p.w*.66,y+1,p.w*.34,p.h-2,2);
    ctx.strokeStyle='#dce4ee';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(p.x+p.w*.5,y-2);ctx.lineTo(p.x+p.w*.5,y-15);ctx.stroke();return;
  }
}

function drawDoge(){
  const x=doge.x,y=sy(doge.y);ctx.save();ctx.translate(x+doge.w/2,y+doge.h/2);
  const airborneStretch=doge.vy<0?1.05:1;
  ctx.scale(.98,airborneStretch);
  ctx.strokeStyle='#d88943';ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();ctx.arc(21,2,11,-1.4,1.3);ctx.stroke();
  ctx.fillStyle='#d88943';rr(-20,-4,40,28,13);
  ctx.fillStyle='#f3e3cf';ctx.beginPath();ctx.ellipse(0,7,10,12,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#dc8d46';ctx.beginPath();ctx.arc(0,-18,18,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.moveTo(-14,-28);ctx.lineTo(-10,-43);ctx.lineTo(-2,-29);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(14,-28);ctx.lineTo(10,-43);ctx.lineTo(2,-29);ctx.closePath();ctx.fill();
  ctx.fillStyle='#78462f';ctx.globalAlpha=.48;
  ctx.beginPath();ctx.moveTo(-11,-30);ctx.lineTo(-9,-39);ctx.lineTo(-5,-30);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(11,-30);ctx.lineTo(9,-39);ctx.lineTo(5,-30);ctx.closePath();ctx.fill();ctx.globalAlpha=1;
  ctx.fillStyle='#f4e5d1';
  ctx.beginPath();ctx.ellipse(-7,-13,8,8,-.25,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(7,-13,8,8,.25,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(0,-8,10,7,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#202020';ctx.beginPath();ctx.arc(-6,-19,2.1,0,Math.PI*2);ctx.arc(6,-19,2.1,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(0,-10,2.6,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#202020';ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(0,-8);ctx.lineTo(0,-5);ctx.moveTo(0,-5);ctx.quadraticCurveTo(-4,-3,-6,-5);ctx.moveTo(0,-5);ctx.quadraticCurveTo(4,-3,6,-5);ctx.stroke();
  ctx.fillStyle='#d88943';rr(-14,16,10,10,5);rr(4,16,10,10,5);
  ctx.restore();
}

function draw(){
  const [a,b]=bg(highest);
  const g=ctx.createLinearGradient(0,0,0,PLAY_H);g.addColorStop(0,a);g.addColorStop(1,b);ctx.fillStyle=g;ctx.fillRect(0,0,W,PLAY_H);

  if(highest<24000){
    ctx.globalAlpha=.08;ctx.fillStyle='#fff';
    for(let i=0;i<4;i++){
      const yy=((i*190+(cameraY*.06))%(PLAY_H+240))-120;rr(-70+i*110,yy,220,30,18);
    }
    ctx.globalAlpha=1;
  }

  if(highest>26000){
    ctx.fillStyle='#fff';ctx.globalAlpha=clamp((highest-26000)/22000,0,1)*.9;
    for(const s of stars)ctx.fillRect(s.x,s.y,s.r,s.r);ctx.globalAlpha=1;
  }

  if(highest>43000){
    const t=clamp((highest-43000)/47000,0,1),ey=PLAY_H+165-t*75;
    ctx.fillStyle='#337aca';ctx.beginPath();ctx.arc(W/2,ey,W*.72,Math.PI,Math.PI*2);ctx.fill();
    ctx.globalAlpha=.36;ctx.fillStyle='#7fc46e';ctx.beginPath();ctx.ellipse(W*.42,ey-28,W*.17,26,-.25,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
  }

  if(highest>86000){
    const t=clamp((highest-86000)/(CFG.moonAltitude-86000),0,1);
    const r=26+t*145;
    ctx.fillStyle='#dddeda';ctx.beginPath();ctx.arc(W*.77,110,r,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=.14;ctx.fillStyle='#8e8f91';ctx.beginPath();ctx.arc(W*.72,105,r*.2,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
  }

  for(const p of platforms){
    const y=sy(p.y);if(y<-100||y>PLAY_H+65)continue;
    ctx.globalAlpha=p.type==='crumbleCloud'&&p.crumble>0?clamp(1-p.crumble*.58,.35,1):1;
    drawPlatform(p,y);ctx.globalAlpha=1;
  }

  for(const q of particles){
    ctx.globalAlpha=clamp(q.life*2.2,0,1);ctx.fillStyle=q.kind==='spark'?'#fff0a8':'#fff';
    ctx.beginPath();ctx.arc(q.x,sy(q.y),q.r,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;drawDoge();

  const fade=ctx.createLinearGradient(0,PLAY_H-38,0,PLAY_H);
  fade.addColorStop(0,'rgba(6,9,20,0)');fade.addColorStop(1,'rgba(6,9,20,.25)');
  ctx.fillStyle=fade;ctx.fillRect(0,PLAY_H-38,W,38);
}

function loop(now){
  const dt=Math.min((now-last)/1000,.033);last=now;
  update(dt);draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

if('serviceWorker'in navigator&&location.protocol.startsWith('http')){
  addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
})();
</script>
